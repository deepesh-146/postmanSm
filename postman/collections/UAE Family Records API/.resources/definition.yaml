$kind: collection
description: Complete API collection for UAE grandfather family record management system
variables:
  base_url: http://localhost:3000
  access_token: your_jwt_token_here
scripts:
  - type: http:beforeRequest
    code: |-
      // Add any pre-request scripts here
      console.log('Making request to UAE Family Records API');
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // Basic response validation
      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test('Response has success property', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('success');
      });

      pm.test('Response has message property', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('message');
      });
    language: text/javascript
auth:
  - id: 33a2d8fa-7cf5-4e3d-bf33-d88cb4ec4a21
    type: bearer
    name: bearer auth
    credentials:
      token: "{{clientToken}}"
