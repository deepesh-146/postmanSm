$kind: http-request
description: Update payslip customization settings. You can update any combination of componentVisibility, componentOrder, customLabels, and isActive. At least one field must be provided.
url: "{{base_url}}/api/payrolls/v3/payslip/customization"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: |-
    {
      "componentVisibility": {
        "employeeInfo": true,
        "payrollPeriod": true,
        "earnings": {
          "basic": true,
          "hra": true,
          "da": false,
          "bonus": true,
          "specialAllowance": true,
          "transportAllowance": false,
          "otherAllowances": true
        },
        "deductions": {
          "pf": true,
          "esi": true,
          "professionalTax": true,
          "gpssa": false,
          "gratuity": true,
          "incomeTax": true
        },
        "attendance": true,
        "summary": true,
        "bankDetails": false,
        "taxDetails": true,
        "allowances": true
      },
      "componentOrder": [
        "employeeInfo",
        "payrollPeriod",
        "earnings",
        "deductions",
        "attendance",
        "summary",
        "taxDetails",
        "allowances",
        "bankDetails"
      ],
      "customLabels": {
        "basic": "Base Salary",
        "hra": "House Rent Allowance"
      },
      "isActive": true
    }
examples: ./.resources/Update Payslip Customization.resources/examples
order: 2000
