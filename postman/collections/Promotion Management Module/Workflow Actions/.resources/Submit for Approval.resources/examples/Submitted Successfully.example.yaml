  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "status": 200,
        "message": "Promotion submitted for approval",
        "data": {
          "id": "uuid-promotion-id",
          "status": "PENDING_APPROVAL",
          "workflow_status": "PENDING",
          "workflowInstanceId": "uuid-workflow-instance-id"
        }
      }
order: 1000
