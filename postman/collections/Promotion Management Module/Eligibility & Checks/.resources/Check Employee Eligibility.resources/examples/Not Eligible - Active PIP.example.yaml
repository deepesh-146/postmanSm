$kind: http-example
request:
  url: "{{base_url}}/promotions/eligibility/{{employee_id}}"
  method: GET
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "status": 200,
        "message": "Eligibility check completed",
        "data": {
          "eligible": false,
          "checks": {
            "pipCheck": { "passed": false, "detail": "Active PIP found (ID: uuid, Status: ACTIVE)" },
            "performanceCheck": { "passed": true, "detail": "Score: 3.8, Band: Meets Expectations (Rank 3)" },
            "duplicateCheck": { "passed": true, "detail": "No pending promotion" },
            "tenureCheck": { "passed": true, "detail": "Tenure: 18 months" }
          },
          "reasons": ["Employee has an active/pending PIP"],
          "performanceData": null
        }
      }
order: 2000
