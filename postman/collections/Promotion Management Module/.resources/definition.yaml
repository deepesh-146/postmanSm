$kind: collection
description: |-
  Complete API collection for the Promotion Management module in ICEIPTS HRMS.

  Base URL: {{base_url}}/api/v1/promotions

  Requires JWT token in Authorization header.
variables:
  base_url: http://localhost:3000/api/v1
  auth_token: ""
  promotion_id: ""
  employee_id: ""
auth:
  - id: b5cbbfd0-96f8-4fe3-8dd2-a0194090115c
    type: bearer
    name: bearer auth
    credentials:
      token: "{{clientToken}}"
