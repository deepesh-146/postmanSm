$kind: collection
description: |-
  Complete API collection for Complaint & Grievance Management module.

  Base URL: {{base_url}}/grievances

  Auth: Bearer token required in all requests.

  Roles:
  - EMPLOYEE: Create, view own, withdraw, reopen
  - MANAGER: + view assigned, update status
  - HR: + all grievances, internal notes, assign, escalate
  - ADMIN: Full access including categories
variables:
  base_url: http://localhost:8080
  grievanceId: ""
  categoryId: ""
  employeeId: ""
auth:
  - id: d7669dad-5634-439a-9c06-fa55152014aa
    type: bearer
    name: bearer auth
    credentials:
      token: "{{clientToken}}"
