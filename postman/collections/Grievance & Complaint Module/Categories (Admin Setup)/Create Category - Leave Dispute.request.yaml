$kind: http-request
description: Create a leave dispute category. Routes to MANAGER first.
url: "{{base_url}}/grievances/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Leave Disputes",
        "code": "LEAVE_DISPUTE",
        "description": "Leave rejection disputes, balance discrepancies",
        "routeTo": "MANAGER",
        "skipManager": false,
        "skipHr": false,
        "isSensitive": false,
        "allowAnonymous": false,
        "defaultPriority": "MEDIUM",
        "slaDays": 7
    }
order: 2000
