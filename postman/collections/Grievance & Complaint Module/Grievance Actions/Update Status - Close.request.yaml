$kind: http-request
url: "{{base_url}}/grievances/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "grievanceId": "{{grievanceId}}",
        "status": "CLOSED",
        "comment": "Grievance has been resolved and closed."
    }
order: 6000
