$kind: http-request
description: Employee can reopen RESOLVED or CLOSED grievances. Increments reopenCount.
url: "{{base_url}}/grievances/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "grievanceId": "{{grievanceId}}",
        "status": "REOPENED",
        "comment": "The issue has not been fully resolved. The deduction is still showing in my account."
    }
order: 7000
