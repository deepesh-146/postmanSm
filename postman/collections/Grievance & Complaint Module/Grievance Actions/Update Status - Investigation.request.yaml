$kind: http-request
url: "{{base_url}}/grievances/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "grievanceId": "{{grievanceId}}",
        "status": "INVESTIGATION",
        "comment": "Formal investigation has been initiated."
    }
order: 3000
