$kind: http-request
description: Returns grievances assigned to the logged-in user (HR/Manager handler view). Anonymous complainant identity is masked.
url: "{{base_url}}/grievances/assigned?page=1&size=10"
method: GET
queryParams:
  - key: page
    value: "1"
  - key: size
    value: "10"
  - key: status
    value: SUBMITTED
    disabled: true
  - key: priority
    value: HIGH
    disabled: true
order: 9000
