$kind: http-request
description: Anonymous grievance. Category must have allowAnonymous=true. System generates alias like EMP-A3F7B2C1. Identity hidden from handler.
url: "{{base_url}}/grievances"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "categoryId": "{{categoryId}}",
        "subject": "Inappropriate behaviour by team lead",
        "description": "My team lead has been making inappropriate remarks during meetings. This has been happening for the past 2 months. I feel uncomfortable and want this addressed confidentially.",
        "isAnonymous": true,
        "priority": "CRITICAL",
        "attachments": [
            "https://s3.amazonaws.com/bucket/evidence1.pdf"
        ],
        "incidentDate": "2026-02-15",
        "incidentLocation": "Floor 3, Conference Room B",
        "againstWhomName": "John Doe",
        "againstWhomEmpId": "<uuid-of-employee-if-applicable>"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.data && jsonData.data.id) {
          pm.collectionVariables.set('grievanceId', jsonData.data.id);
      }
    language: text/javascript
order: 2000
