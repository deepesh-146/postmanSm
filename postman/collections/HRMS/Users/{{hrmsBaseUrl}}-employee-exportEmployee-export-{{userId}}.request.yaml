$kind: http-request
name: "{{hrmsBaseUrl}}/employee/exportEmployee/export/{{userId}}"
url: "{{hrmsBaseUrl}}/employee/exportEmployee/export/{{userId}}"
method: GET
body:
  type: json
  content: "{\r

    \    \"emailId\": \"deepesh72@gmail.com\",\r

    \    \"password\": \"SSSD\",\r

    \    \"ipAddress\": \"127.0.0.1\",\r

    \    \"flag\": true\r

    }"
scripts:
  - type: afterResponse
    code: "let response = pm.response.json();\r

      \r

      if (response.status.success) {\r

      \    let userId = response.data.loginData.employee.id;\r

      \    let clientToken = response.data.accessToken;\r

      \r

      \    pm.environment.set(\"userId\", userId);\r

      \    pm.environment.set(\"clientToken\", clientToken);\r

      \r

      \    console.log(\"User ID:\", userId);\r

      \    console.log(\"Client Token:\", clientToken);\r

      } else {\r

      \    console.log(\"Request failed, status:\", response.status.message);\r

      }\r\n"
    language: text/javascript
examples: ./.resources/{{hrmsBaseUrl}}-employee-exportEmployee-export-{{userId}}.resources/examples
order: 10000
