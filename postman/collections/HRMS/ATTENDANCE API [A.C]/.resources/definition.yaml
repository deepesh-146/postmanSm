  ## 1. `POST /attendance/punch` — Smart Punch Toggle

  Automatically punches IN if no active punch, or punches OUT if already punched in.

  **Request Body:**

  ```
  {
    "employeeId": "uuid-string",          // required
    "mode": "MANUAL",                      // optional: "MANUAL" | "BIOMETRIC" | "RFID" | "MOBILE_APP" (default: "MANUAL")
    "workLocationType": "OFFICE",          // optional: "OFFICE" | "WFH" | "REMOTE" (default: "OFFICE")
    "locationJSON": { "lat": 28.6, "lng": 77.2 },  // optional
    "empComment": "Starting morning shift" // optional
  }

   ```

  **Response (Punch In):**

  ```
  {
    "success": true,
    "message": "Punch-in recorded successfully (punch #1)",
    "data": {
      "attendanceId": "uuid",
      "punchId": "uuid",
      "punchSequence": 1,
      "punchIn": "2026-03-24T14:30:00.000Z",
      "attDate": "2026-03-24"
    }
  }

   ```

  **Response (Punch Out):**

  ```
  {
    "success": true,
    "message": "Punch-out recorded successfully. Total work: 8.50 hours",
    "data": {
      "attendanceId": "uuid",
      "punchId": "uuid",
      "punchOut": "2026-03-24T23:00:00.000Z",
      "durationMinutes": 510,
      "totalWorkHours": 8.5,
      "totalBreakMinutes": 30,
      "overtimeMinutes": 30,
      "isOvertime": true,
      "isDoubleShift": false,
      "isMultiShift": false,
      "shiftsCovered": 1,
      "isAllPunchedOut": true,
      "daysCoveredJSON": null
    }
  }

   ```

  ---

  ## 2. `GET /attendance/activePunch` — Get Active Punch

  **Query Params:**

  ```
  ?employeeId=uuid-string

   ```

  **Response:**

  ```
  {
    "success": true,
    "data": {
      "isActive": true,
      "punch": {
        "id": "uuid",
        "attendanceId": "uuid",
        "employeeId": "uuid",
        "punchIn": "2026-03-24T14:30:00.000Z",
        "punchOut": null,
        "punchSequence": 2,
        "durationMinutes": null,
        "mode": "MANUAL",
        "attendance": { /* parent attendance record */ }
      }
    }
  }

   ```

