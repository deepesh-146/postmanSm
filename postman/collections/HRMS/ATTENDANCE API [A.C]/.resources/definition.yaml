  ## 6. `POST /attendance/overtimeConfig` — Create/Update Config

  **Request Body:**

  ```
  {
    "level": "OFFICE",                     // required: "ORGANIZATION" | "OFFICE" | "DEPARTMENT"
    "levelId": "uuid-of-office",           // required: UUID of the org/office/dept
    "standardShiftHours": 8,               // optional (default: 8, min: 1, max: 24)
    "overtimeEnabled": true,               // optional (default: false)
    "overtimePayEnabled": true,            // optional (default: false)
    "overtimeMultiplier": 1.5,             // optional (default: 1.25, min: 1, max: 10) — pay multiplier for OT
    "doubleShiftEnabled": true,            // optional (default: true)
    "doubleShiftPayEnabled": true,         // optional (default: true)
    "doubleShiftThresholdHours": 16,       // optional (default: 16, min: 8, max: 48)
    "doubleShiftLeaveCredit": true,        // optional (default: true) — auto-credit leave for double shift
    "doubleShiftLeaveTypeId": "uuid",      // optional — which leave type to credit (null = auto-find DSCL)
    "maxDailyWorkHours": 32,              // optional (default: 32, min: 8, max: 48) — cap for extreme shifts
    "multiPunchEnabled": true              // optional (default: true)
  }

   ```

  **Response:**

  ```
  {
    "success": true,
    "message": "Configuration created successfully",
    "data": { /* full config object */ }
  }

   ```

  ---

  ## 7. `GET /attendance/overtimeConfig` — Get Config (Auto-resolves hierarchy)

  **Query Params (optional):**

  ```
  ?level=OFFICE&levelId=uuid

   ```

  If omitted, auto-resolves: Department → Office → Organization from `req.user`.

  ---

  ## 8. `GET /attendance/overtimeConfig/all` — Get All Configs

  No params needed. Returns all configs ordered by level.

  ---

  ## 9. `DELETE /attendance/overtimeConfig/:id` — Delete Config

  **URL Param:** `:id` = UUID of the config to delete.

  ---

  ### Key Business Logic Recap

  | Hours Worked | Classification | Result |
  | --- | --- | --- |
  | 0–8 hrs | Normal shift | 1 day attendance |
  | 8–16 hrs | Overtime | Extra pay (if enabled by admin) |
  | 16+ hrs | Double shift | Covers next working day + 1 leave credited |
  | 24+ hrs | Multi shift (3x) | Covers 2 more days + 2 leaves credited |
  | 32 hrs | Quad shift (4x) | Covers 3 more days + 3 leaves credited |

  EndFragment
