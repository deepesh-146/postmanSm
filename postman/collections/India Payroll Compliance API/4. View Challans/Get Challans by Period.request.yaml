$kind: http-request
description: Get challans for specific month and year.
url: "{{hrmsBaseUrl}}/compliance/challans?month=1&year=2026&page=1&limit=20"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  - key: month
    value: "1"
    description: January
  - key: year
    value: "2026"
  - key: page
    value: "1"
  - key: limit
    value: "20"
order: 4000
