$kind: http-request
description: Get detailed challan summary including employee-wise breakdown, totals, and file info.
url: "{{hrmsBaseUrl}}/compliance/{{challanId}}/summary"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response has challan details', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data).to.have.property('challanNumber');
          pm.expect(jsonData.data).to.have.property('totals');
          pm.expect(jsonData.data).to.have.property('items');
          pm.expect(jsonData.data.items).to.be.an('array');
      });
    language: text/javascript
order: 5000
