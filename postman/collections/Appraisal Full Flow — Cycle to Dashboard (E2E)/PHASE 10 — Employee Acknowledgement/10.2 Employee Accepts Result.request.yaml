$kind: http-request
description: Employee accepts. Score status → ACKNOWLEDGED.
url: "{{baseUrl}}/appraisal-finalization/my/cycle/{{cycleId}}/acknowledge"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "status": "ACCEPTED"
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res.data && res.data.id) {
          pm.collectionVariables.set('ackId', res.data.id);
          console.log('ackId set:', res.data.id);
      }
    language: text/javascript
order: 2000
