$kind: http-request
description: "Add recommendation. Types: PROMOTION, INCREMENT, BONUS, TRAINING, NO_ACTION."
url: "{{baseUrl}}/appraisal-finalization/scores/{{finalScoreId}}/recommendations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "type": "PROMOTION",
        "details": "Recommend promotion to Senior Engineer based on consistent outstanding performance",
        "priority": "HIGH"
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res.data && res.data.id) {
          pm.collectionVariables.set('recommendationId', res.data.id);
          console.log('recommendationId set:', res.data.id);
      }
    language: text/javascript
order: 1000
