$kind: http-request
url: "{{baseUrl}}/appraisal-finalization/bands"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "bandName": "Outstanding",
        "minScore": 4.5,
        "maxScore": 5.0,
        "colorCode": "#28a745",
        "sortOrder": 1,
        "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      if (res.data && res.data.id) {
          pm.collectionVariables.set('bandId', res.data.id);
      }
    language: text/javascript
order: 1000
