$kind: http-request
description: Create a second KRA so the weighted score calculation is meaningful (60% + 40% = 100%).
url: "{{baseUrl}}/goals/kra/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "attribute": "Team Collaboration",
        "description": "Cross-functional teamwork and communication",
        "weightage": "40",
        "startDate": "2026-01-01",
        "endDate": "2026-03-31",
        "status": "Active",
        "departmentId": "{{departmentId}}",
        "employeeId": "{{employeeId}}"
    }
order: 2000
