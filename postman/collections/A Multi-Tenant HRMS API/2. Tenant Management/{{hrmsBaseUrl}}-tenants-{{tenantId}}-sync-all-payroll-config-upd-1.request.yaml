$kind: http-request
name: "{{hrmsBaseUrl}}/tenants/{{tenantId}}/sync-all-payroll-config?updateExisting=false&onlyMissing=true Copy"
description: Update tenant configuration (branding, features, settings).
url: "{{hrmsBaseUrl}}/tenants/{{tenantId}}/:status"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: status
    value: activate
    description: deactivate
body:
  type: text
  content: |-
    {
      "logoUrl": "https://example.com/logo.png",
      "primaryColor": "#007bff",
      "secondaryColor": "#6c757d",
      "featureFlags": {
        "attendance": true,
        "payroll": true,
        "recruitment": false
      },
      "customSettings": {
        "timezone": "Asia/Kolkata",
        "currency": "INR"
      }
    }
order: 7000
