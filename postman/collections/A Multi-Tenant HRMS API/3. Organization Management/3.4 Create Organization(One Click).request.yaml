$kind: http-request
description: Create a new organization. TenantId is automatically set from token.
url: "{{hrmsBaseUrl}}/organizations/createOrganizationFull"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |
    {
      "orgName": "Falcon Manufacturing",
      "orgEmail": "realestate@falcon.com",
      "adminFirstName": "Deepesh",
      "adminLastName": "Mehta",
      "adminEmail": "deepesh72@gmail.com",
      "adminMobile": "9876543210",
      "adminPassword": "5684",
      "adminGender": "Male",
      "adminDob": "1990-01-01",
      "nationality": "Indian",
      "maritalStatus": "Single"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const response = pm.response.json();
          if (response.data && response.data.id) {
              pm.environment.set('organizationId', response.data.id);
              console.log('✅ New organization ID saved:', response.data.name);
          }
      }
    language: text/javascript
order: 4000
