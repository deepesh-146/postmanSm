$kind: http-request
description: Create config for Tally ERP 9 (same XML format as Tally Prime, both use port 9000)
url: "{{baseUrl}}/erp/config"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "erpType": "TALLY_ERP9",
        "serverUrl": "http://192.168.1.100",
        "port": 9000,
        "companyName": "My Company",
        "isActive": true,
        "tallyLedgerPrefix": ""
    }
order: 2000
