$kind: http-request
description: Update an existing ERP configuration. All fields are optional.
url: "{{baseUrl}}/erp/config/{{erpConfigId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "serverUrl": "http://192.168.1.200",
        "port": 9000,
        "companyName": "Updated Company Name",
        "isActive": true
    }
order: 4000
