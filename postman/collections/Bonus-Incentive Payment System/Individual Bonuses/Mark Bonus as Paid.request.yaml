$kind: http-request
description: Mark bonus as paid (Finance only)
url: "{{base_url}}/api/bonus/:id/mark-paid"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
pathVariables:
  - key: id
    value: "{{bonus_id}}"
    description: Bonus UUID
body:
  type: json
  content: |-
    {
      "paymentReference": "TXN123456789"
    }
order: 6000
