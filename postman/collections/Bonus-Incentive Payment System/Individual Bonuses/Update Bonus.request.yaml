$kind: http-request
description: Update bonus details (only before approval)
url: "{{base_url}}/api/bonus/:id"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
pathVariables:
  - key: id
    value: "{{bonus_id}}"
    description: Bonus UUID
body:
  type: json
  content: |-
    {
      "amount": 60000,
      "reason": "Updated performance bonus",
      "tdsAmount": 6000
    }
order: 5000
