$kind: http-request
description: List payout cycles with optional filters
url: "{{base_url}}/api/bonus/payout-cycles?page=1&size=10"
method: GET
headers:
  Authorization: Bearer {{access_token}}
queryParams:
  - key: page
    value: "1"
    description: Page number
  - key: size
    value: "10"
    description: Page size
  - key: status
    value: FINALIZED
    disabled: true
    description: "Filter by status: DRAFT, FINALIZED, PAID, CANCELLED"
  - key: month
    value: 2025-04
    disabled: true
    description: Filter by month (YYYY-MM format)
order: 3000
