$kind: http-request
description: Finalize a DRAFT cycle. Locks all bonuses and calculates totals.
url: "{{base_url}}/api/bonus/payout-cycles/:id/finalize"
method: POST
headers:
  Authorization: Bearer {{access_token}}
pathVariables:
  - key: id
    value: "{{cycle_id}}"
    description: Cycle UUID
order: 7000
