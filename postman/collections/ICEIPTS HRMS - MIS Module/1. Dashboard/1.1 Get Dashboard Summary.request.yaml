$kind: http-request
description: "Returns all KPI widgets in a single call: employee metrics, attendance %, leave utilization, payroll cost, recruitment pipeline, training completion, performance scores."
url: "{{baseUrl}}/mis/dashboard-summary?dateFrom=2025-01-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2025-01-01
    description: Start date (YYYY-MM-DD). Defaults to start of current year
  - key: dateTo
    value: 2026-03-13
    description: End date (YYYY-MM-DD). Defaults to today
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
    description: "Optional: Filter by department UUID"
  - key: officeId
    value: "{{officeId}}"
    disabled: true
    description: "Optional: Filter by office UUID"
examples: ./.resources/1.1 Get Dashboard Summary.resources/examples
order: 1000
