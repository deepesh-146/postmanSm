$kind: http-request
description: List historical snapshots with optional filters.
url: "{{baseUrl}}/mis/snapshots?page=1&size=10"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: page
    value: "1"
  - key: size
    value: "10"
  - key: category
    value: EMPLOYEE
    disabled: true
    description: EMPLOYEE | ATTENDANCE | LEAVE | PAYROLL | RECRUITMENT | TRAINING | PERFORMANCE
  - key: snapshotType
    value: DAILY
    disabled: true
    description: DAILY | WEEKLY | MONTHLY | QUARTERLY | YEARLY
  - key: dateFrom
    value: 2025-01-01
    disabled: true
  - key: dateTo
    value: 2026-03-13
    disabled: true
order: 3000
