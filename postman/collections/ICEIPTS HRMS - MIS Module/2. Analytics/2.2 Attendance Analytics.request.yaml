$kind: http-request
description: "Returns: summary (present/absent/halfday/leave counts, attendance_percentage), departmentAttendance, dailyTrend, lateArrivals, avgWorkingHours."
url: "{{baseUrl}}/mis/attendance-analytics?dateFrom=2026-03-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2026-03-01
  - key: dateTo
    value: 2026-03-13
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
  - key: officeId
    value: "{{officeId}}"
    disabled: true
examples: ./.resources/2.2 Attendance Analytics.resources/examples
order: 2000
