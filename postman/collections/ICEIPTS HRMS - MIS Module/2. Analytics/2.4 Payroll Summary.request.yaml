$kind: http-request
description: "Returns: monthlyCost (gross/net/deductions per month), departmentPayroll (with avg salary), componentBreakdown, costTrend, summary totals."
url: "{{baseUrl}}/mis/payroll-summary?dateFrom=2025-01-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2025-01-01
  - key: dateTo
    value: 2026-03-13
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
examples: ./.resources/2.4 Payroll Summary.resources/examples
order: 4000
