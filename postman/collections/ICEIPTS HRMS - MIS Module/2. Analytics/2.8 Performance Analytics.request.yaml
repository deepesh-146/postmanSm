$kind: http-request
description: "Returns: scoreDistribution (by performance band), departmentScores (avg score per dept), completionStatus (appraisal cycle completion %)."
url: "{{baseUrl}}/mis/performance-analytics?dateFrom=2025-01-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2025-01-01
  - key: dateTo
    value: 2026-03-13
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
examples: ./.resources/2.8 Performance Analytics.resources/examples
order: 8000
