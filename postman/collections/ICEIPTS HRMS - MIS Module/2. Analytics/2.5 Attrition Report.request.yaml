$kind: http-request
description: "Returns: totalResignations, attritionRate (%), avgHeadcount, departmentAttrition (with per-dept rate), monthlyTrend, tenureAtExit, reasons."
url: "{{baseUrl}}/mis/attrition-report?dateFrom=2025-01-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2025-01-01
  - key: dateTo
    value: 2026-03-13
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
examples: ./.resources/2.5 Attrition Report.resources/examples
order: 5000
