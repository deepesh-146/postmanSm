$kind: http-request
description: "Returns: leaveByType (with avg days per request), departmentLeave, monthlyTrend, approvalStats, leaveBalanceSummary."
url: "{{baseUrl}}/mis/leave-analytics?dateFrom=2025-01-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2025-01-01
  - key: dateTo
    value: 2026-03-13
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
examples: ./.resources/2.3 Leave Analytics.resources/examples
order: 3000
