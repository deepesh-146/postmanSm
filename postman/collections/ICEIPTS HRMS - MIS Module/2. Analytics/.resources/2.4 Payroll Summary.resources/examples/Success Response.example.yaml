$kind: http-example
request:
  url: "{{baseUrl}}/mis/payroll-summary?dateFrom=2025-01-01&dateTo=2026-03-13"
  method: GET
  headers:
    Content-Type: application/json
    x-organization-id: "{{organizationId}}"
  queryParams:
    - key: dateFrom
      value: 2025-01-01
    - key: dateTo
      value: 2026-03-13
    - key: departmentId
      value: "{{departmentId}}"
      disabled: true
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "status": 200,
        "message": "Payroll summary retrieved successfully",
        "data": {
          "monthlyCost": [
            { "month": "2025-01", "gross_salary": 12500000, "net_salary": 10200000, "total_deductions": 2300000, "employer_contribution": 1800000, "employees_paid": 1200 }
          ],
          "departmentPayroll": [
            { "department": "Engineering", "gross_salary": 4500000, "net_salary": 3600000, "headcount": 150, "avg_salary": 30000 }
          ],
          "componentBreakdown": [
            { "component": "Basic Salary", "type": "EARNING", "total_amount": 7500000, "employee_count": 1200 },
            { "component": "HRA", "type": "EARNING", "total_amount": 3000000, "employee_count": 1200 },
            { "component": "PF", "type": "DEDUCTION", "total_amount": 900000, "employee_count": 1200 }
          ],
          "costTrend": [
            { "month": "2025-01", "totalCTC": 14300000, "grossSalary": 12500000, "netSalary": 10200000 }
          ],
          "summary": {
            "totalGross": 150000000,
            "totalNet": 122400000,
            "totalDeductions": 27600000,
            "avgEmployeesPaid": 1200
          }
        }
      }
order: 1000
