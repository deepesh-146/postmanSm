$kind: http-example
request:
  url: "{{baseUrl}}/mis/attrition-report?dateFrom=2025-01-01&dateTo=2026-03-13"
  method: GET
  headers:
    Content-Type: application/json
    x-organization-id: "{{organizationId}}"
  queryParams:
    - key: dateFrom
      value: 2025-01-01
    - key: dateTo
      value: 2026-03-13
    - key: departmentId
      value: "{{departmentId}}"
      disabled: true
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "status": 200,
        "message": "Attrition report retrieved successfully",
        "data": {
          "totalResignations": 42,
          "attritionRate": 3.45,
          "avgHeadcount": 1218,
          "departmentAttrition": [
            { "department": "Sales", "resignations": 12, "current_headcount": 80, "attritionRate": "15.00" },
            { "department": "Engineering", "resignations": 8, "current_headcount": 150, "attritionRate": "5.33" }
          ],
          "monthlyTrend": [
            { "month": "2025-01", "resignations": 3 },
            { "month": "2025-02", "resignations": 5 }
          ],
          "tenureAtExit": [
            { "tenure_group": "Less than 1 year", "count": 15 },
            { "tenure_group": "1-2 years", "count": 12 },
            { "tenure_group": "3-5 years", "count": 10 },
            { "tenure_group": "5+ years", "count": 5 }
          ],
          "reasons": [
            { "reason": "Better Opportunity", "count": 18 },
            { "reason": "Personal", "count": 10 },
            { "reason": "Relocation", "count": 8 },
            { "reason": "Not Specified", "count": 6 }
          ]
        }
      }
order: 1000
