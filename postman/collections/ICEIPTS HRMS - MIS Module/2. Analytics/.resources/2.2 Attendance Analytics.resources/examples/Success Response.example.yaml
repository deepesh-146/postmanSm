$kind: http-example
request:
  url: "{{baseUrl}}/mis/attendance-analytics?dateFrom=2026-03-01&dateTo=2026-03-13"
  method: GET
  headers:
    Content-Type: application/json
    x-organization-id: "{{organizationId}}"
  queryParams:
    - key: dateFrom
      value: 2026-03-01
    - key: dateTo
      value: 2026-03-13
    - key: departmentId
      value: "{{departmentId}}"
      disabled: true
    - key: officeId
      value: "{{officeId}}"
      disabled: true
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "status": 200,
        "message": "Attendance analytics retrieved successfully",
        "data": {
          "summary": {
            "unique_employees": 1200,
            "total_records": 15600,
            "present_days": 13200,
            "absent_days": 480,
            "halfday_count": 120,
            "leave_days": 600,
            "weekly_offs": 900,
            "holidays": 300,
            "attendance_percentage": 94.50
          },
          "departmentAttendance": [
            { "department": "Engineering", "employees": 150, "attendance_pct": 96.20 },
            { "department": "Sales", "employees": 80, "attendance_pct": 91.30 }
          ],
          "dailyTrend": [
            { "date": "2026-03-01", "present": 1100, "absent": 50, "on_leave": 50 },
            { "date": "2026-03-02", "present": 1080, "absent": 60, "on_leave": 60 }
          ],
          "lateArrivals": { "total_late": 230, "unique_late_employees": 85 },
          "avgWorkingHours": 8.45
        }
      }
order: 1000
