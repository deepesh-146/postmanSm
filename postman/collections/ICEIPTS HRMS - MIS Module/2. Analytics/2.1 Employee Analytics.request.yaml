$kind: http-request
description: "Returns: totalEmployees, newHires, departmentDistribution, genderDistribution, ageDistribution, tenureDistribution, headcountTrend (12 months)."
url: "{{baseUrl}}/mis/employee-analytics?dateFrom=2025-01-01&dateTo=2026-03-13"
method: GET
headers:
  Content-Type: application/json
  x-organization-id: "{{organizationId}}"
queryParams:
  - key: dateFrom
    value: 2025-01-01
  - key: dateTo
    value: 2026-03-13
  - key: departmentId
    value: "{{departmentId}}"
    disabled: true
  - key: officeId
    value: "{{officeId}}"
    disabled: true
  - key: page
    value: "1"
    disabled: true
  - key: size
    value: "10"
    disabled: true
examples: ./.resources/2.1 Employee Analytics.resources/examples
order: 1000
